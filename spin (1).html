<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>عجلة الجوائز — المتميز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --or:#FF5722;--or2:#FF7043;--nv:#0A1628;--nv2:#0F2040;
  --wh:#fff;--gl:#F8F9FD;--gm:#E2E6F0;--tm:#52637A;
  --green:#10B981;--gold:#F59E0B;
}
body{font-family:'Cairo',sans-serif;background:linear-gradient(145deg,var(--nv) 0%,var(--nv2) 60%,#1a1048 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem;overflow-x:hidden}

/* ── stars bg ── */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(255,87,34,.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(99,102,241,.1) 0%,transparent 50%);pointer-events:none}

.page-title{color:rgba(255,255,255,.7);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:.5rem}
.page-head{color:#fff;font-size:24px;font-weight:900;text-align:center;margin-bottom:.3rem}
.page-sub{color:rgba(255,255,255,.55);font-size:13px;text-align:center;margin-bottom:2rem}

/* ── wheel container ── */
.wheel-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem}

/* مثلث الإشارة */
.wheel-pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--gold);z-index:10;filter:drop-shadow(0 2px 6px rgba(245,158,11,.5))}

canvas#wheel{border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 40px rgba(255,87,34,.2);display:block}

/* ── spin button ── */
.spin-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;padding:16px 28px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border:none;border-radius:14px;font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;cursor:pointer;transition:all .25s;box-shadow:0 6px 28px rgba(255,87,34,.45);-webkit-tap-highlight-color:transparent}
.spin-btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,87,34,.55)}
.spin-btn:active{transform:scale(.97)}
.spin-btn:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.35);cursor:not-allowed;box-shadow:none;transform:none}
.spin-btn svg{width:22px;height:22px;flex-shrink:0}

/* ── already played ── */
.played-msg{text-align:center;padding:2rem 1.5rem;color:rgba(255,255,255,.6);font-size:14px;line-height:1.8}
.played-icon{font-size:52px;margin-bottom:.75rem}
.played-prize{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:1rem 1.5rem;margin:1rem 0;color:#fff;font-size:16px;font-weight:700}

/* ── prize modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(10,22,40,.88);display:none;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(6px)}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(145deg,#fff 0%,#f8f3ff 100%);border-radius:24px 24px 0 0;padding:2rem 1.5rem 3rem;width:100%;max-width:480px;text-align:center;animation:slideUp .35s cubic-bezier(.32,1,.68,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-confetti{font-size:48px;margin-bottom:.5rem;animation:bounce .6s ease infinite alternate}
@keyframes bounce{from{transform:scale(1)}to{transform:scale(1.15)}}
.modal-title{font-size:22px;font-weight:900;color:var(--nv);margin-bottom:.3rem}
.modal-prize-box{background:linear-gradient(135deg,var(--or),var(--or2));border-radius:14px;padding:1.25rem 1.5rem;margin:1.25rem 0;box-shadow:0 6px 24px rgba(255,87,34,.35)}
.modal-prize-label{color:rgba(255,255,255,.8);font-size:12px;font-weight:700;margin-bottom:.3rem}
.modal-prize-name{color:#fff;font-size:22px;font-weight:900}
.modal-prize-desc{color:rgba(255,255,255,.8);font-size:13px;margin-top:.4rem}
.modal-close{width:100%;padding:14px;background:var(--nv);color:#fff;border:none;border-radius:12px;font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;cursor:pointer;margin-top:.5rem;transition:background .2s}
.modal-close:hover{background:var(--nv2)}

/* ── loader ── */
.loader{color:rgba(255,255,255,.5);font-size:13px;text-align:center;padding:2rem}
</style>
</head>
<body>

<div class="page-title">🎰 المتميز للتوصيل</div>
<div class="page-head">عجلة الجوائز</div>
<div class="page-sub">لفّ العجلة واكسب جايزتك!</div>

<div id="app"><div class="loader">⏳ جاري التحميل...</div></div>

<!-- مودال الجايزة -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-confetti" id="m-confetti">🎉</div>
    <div class="modal-title">مبروك! 🎊</div>
    <div class="modal-prize-box">
      <div class="modal-prize-label">جايزتك</div>
      <div class="modal-prize-name" id="m-name"></div>
      <div class="modal-prize-desc" id="m-desc"></div>
    </div>
    <p style="color:var(--tm);font-size:12.5px;line-height:1.7;margin-bottom:1rem">
      احتفظ بهذه الشاشة وأبلغ المندوب عند استلام طلبك 🛵
    </p>
    <button class="modal-close" onclick="closeModal()">تمام، شكراً! 🙌</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const FB = {
  apiKey:"AIzaSyCu31Gb8MLmvxAZCurGKTSQs4DTePSWw_I",
  authDomain:"etlop--mn---betak.firebaseapp.com",
  projectId:"etlop--mn---betak",
  storageBucket:"etlop--mn---betak.firebasestorage.app",
  messagingSenderId:"415855489057",
  appId:"1:415855489057:web:d3526177d5a4353332f360"
};
const app = initializeApp(FB);
const db  = getFirestore(app);

/* ──────────────────────────────────────────────
   الجوائز الافتراضية — بتتحمل من Firestore
   لو موجودة في collection "spin_prizes"
   لو مش موجودة → بتستخدم الافتراضية دي
   ────────────────────────────────────────────── */
const DEFAULT_PRIZES = [
  { label:'خصم 10 جم',  color:'#FF5722', desc:'خصم على طلبك القادم',      emoji:'💰', weight:25 },
  { label:'خصم 20 جم',  color:'#E91E63', desc:'وفّر أكتر على توصيلتك',    emoji:'🎁', weight:20 },
  { label:'توصيل مجاني',color:'#9C27B0', desc:'التوصيل على حسابنا!',       emoji:'🛵', weight:10 },
  { label:'هدية مفاجأة',color:'#2196F3', desc:'المندوب هيجيبلك مفاجأة 😉', emoji:'🎊', weight:15 },
  { label:'خصم 5 جم',   color:'#009688', desc:'خصم صغير مع كل طلب',        emoji:'✨', weight:30 },
  { label:'حظ أوفر!',   color:'#FF9800', desc:'العجلة اتقلبت عليك 😄',     emoji:'🍀', weight:35 },
  { label:'خصم 15 جم',  color:'#F44336', desc:'نص اللي بتدفعه',            emoji:'🏆', weight:18 },
  { label:'جايزة الأسبوع',color:'#673AB7',desc:'تواصل معنا على واتساب',    emoji:'🌟', weight:5  },
];

/* معرّف الجهاز */
function getDeviceId(){
  let id = localStorage.getItem('emb_spin_device');
  if(!id){
    id = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2,9);
    localStorage.setItem('emb_spin_device', id);
  }
  return id;
}

/* رسم العجلة */
function drawWheel(prizes, rotation=0){
  const canvas = document.getElementById('wheel');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const n = prizes.length;
  const arc = (2 * Math.PI) / n;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r  = cx - 4;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  prizes.forEach((p, i) => {
    const start = rotation + i * arc;
    const end   = start + arc;
    const mid   = start + arc / 2;

    /* القطاع */
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* النص */
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${canvas.width < 300 ? 10 : 12}px Cairo`;
    ctx.fillText(p.label, r - 14, 5);
    ctx.font = `${canvas.width < 300 ? 14 : 16}px serif`;
    ctx.fillText(p.emoji, r - 8 - ctx.measureText(p.label).width - 10, 5);
    ctx.restore();
  });

  /* دائرة المركز */
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 16, 0, 2 * Math.PI);
  ctx.fillStyle = '#FF5722';
  ctx.fill();
}

/* اختيار الجايزة بناءً على الوزن */
function pickPrize(prizes){
  const total = prizes.reduce((s, p) => s + (p.weight||10), 0);
  let rand = Math.random() * total;
  for(let i=0; i<prizes.length; i++){
    rand -= (prizes[i].weight||10);
    if(rand <= 0) return i;
  }
  return prizes.length - 1;
}

/* ── الدالة الرئيسية ── */
async function init(){
  const deviceId = getDeviceId();

  /* جلب الجوائز من Firestore */
  let prizes = [...DEFAULT_PRIZES];
  try {
    const cfgDoc = await getDoc(doc(db, 'spin_config', 'prizes'));
    if(cfgDoc.exists() && cfgDoc.data().prizes?.length){
      prizes = cfgDoc.data().prizes;
    }
  } catch(e){ /* استخدم الافتراضية */ }

  /* التحقق هل لعب قبل كده */
  let played = false;
  let savedPrize = null;
  try {
    const playDoc = await getDoc(doc(db, 'spin_plays', deviceId));
    if(playDoc.exists()){
      played = true;
      savedPrize = playDoc.data().prize;
    }
  } catch(e){}

  const app = document.getElementById('app');

  if(played && savedPrize){
    /* عرض الجايزة القديمة */
    app.innerHTML = `
      <div class="played-msg">
        <div class="played-icon">🎟️</div>
        <p>أنت لعبت العجلة من قبل!</p>
        <div class="played-prize">${savedPrize.emoji || '🎁'} ${savedPrize.label}</div>
        <p style="font-size:12px;color:rgba(255,255,255,.4);margin-top:.5rem">${savedPrize.desc || ''}</p>
        <p style="margin-top:1.5rem;font-size:12px;color:rgba(255,255,255,.35)">
          فرصة واحدة لكل جهاز 😊
        </p>
      </div>`;
    return;
  }

  /* حجم العجلة */
  const size = Math.min(window.innerWidth - 48, 320);

  app.innerHTML = `
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <canvas id="wheel" width="${size}" height="${size}"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="window._spin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      العب دلوقتي!
    </button>
    <p style="color:rgba(255,255,255,.3);font-size:11px;text-align:center;margin-top:1rem">
      🎲 فرصة واحدة لكل جهاز
    </p>`;

  drawWheel(prizes);

  /* دالة الدوران */
  let spinning = false;
  let currentRotation = 0;

  window._spin = async function(){
    if(spinning) return;
    spinning = true;

    const btn = document.getElementById('spinBtn');
    btn.disabled = true;
    btn.textContent = '⏳ جاري الدوران...';

    const winIndex  = pickPrize(prizes);
    const n         = prizes.length;
    const arc       = (2 * Math.PI) / n;

    /* حساب زاوية الوقف */
    const winAngle  = winIndex * arc + arc / 2;
    const targetRot = currentRotation + (Math.PI * 2 * (5 + Math.random()*3))
                      - (winAngle - Math.PI / 2 + currentRotation % (Math.PI*2));

    const duration  = 4500;
    const startTime = performance.now();
    const startRot  = currentRotation;

    function easeOut(t){ return 1 - Math.pow(1 - t, 4); }

    function animate(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      currentRotation = startRot + (targetRot - startRot) * easeOut(t);
      drawWheel(prizes, currentRotation);
      if(t < 1){ requestAnimationFrame(animate); return; }

      /* انتهى الدوران */
      spinning = false;
      const prize = prizes[winIndex];

      /* حفظ في Firebase */
      setDoc(doc(db, 'spin_plays', deviceId), {
        prize,
        playedAt: serverTimestamp(),
        deviceId
      }).catch(()=>{});

      /* عرض المودال */
      document.getElementById('m-confetti').textContent = prize.emoji || '🎉';
      document.getElementById('m-name').textContent     = prize.label;
      document.getElementById('m-desc').textContent     = prize.desc || '';
      document.getElementById('modal').classList.add('show');
    }

    requestAnimationFrame(animate);
  };
}

window.closeModal = function(){
  document.getElementById('modal').classList.remove('show');
  /* بعد الإغلاق، يعرضله الجايزة ثابتة */
  init();
};

init();
</script>
</body>
</html>
