<!-- إلغاء ومنع عمل الزوم إن والزوم أوت التلقائي واليدوي للحفاظ على أبعاد التصميم ثابتة ومريحة في التصفح وملائمة لأبعاد شاشات الهواتف -->

<script type="module">import { collection as fbCollection, query as fbQuery, where as fbWhere, onSnapshot as fbOnSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

let clientAreas = [];

window.addEventListener('load', () => {
  setTimeout(() => {
    if (!window.db) return;
    
    const q = fbQuery(fbCollection(window.db, "areas"), fbWhere("visible", "==", true));
    
    fbOnSnapshot(q, (snapshot) => {
      clientAreas = [];
      const selectEl = document.getElementById('order-area-select');
      if (!selectEl) return;
      
      selectEl.innerHTML = '<option value="">-- اختر المنطقة لطلب التوصيل --</option>';
      
      snapshot.forEach((docSnap) => {
        const areaData = docSnap.data();
        clientAreas.push({ id: docSnap.id, ...areaData });
        
        const opt = document.createElement('option');
        opt.value = areaData.name;
        opt.textContent = `${areaData.name} (${areaData.price} جم)`;
        opt.dataset.price = areaData.price;
        selectEl.appendChild(opt);
      });
    });
  }, 1000); // مهلة للتأكد من اتصال Firebase
});

window.updateDeliveryPrice = function() {
  const selectEl = document.getElementById('order-area-select');
  const priceDisplay = document.getElementById('client-delivery-price');
  
  if (!selectEl || !priceDisplay) return;
  
  const selectedOption = selectEl.options[selectEl.selectedIndex];
  const price = selectedOption ? (selectedOption.dataset.price || 0) : 0;
  
  priceDisplay.textContent = `${price} جم`;
};

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, doc, updateDoc, onSnapshot, query, where, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCu31Gb8MLmvxAZCurGKTSQs4DTePSWw_I",
    authDomain: "etlop--mn---betak.firebaseapp.com",
    databaseURL: "https://etlop--mn---betak-default-rtdb.firebaseio.com",
    projectId: "etlop--mn---betak",
    storageBucket: "etlop--mn---betak.firebasestorage.app",
    messagingSenderId: "415855489057",
    appId: "1:415855489057:web:d3526177d5a4353332f360",
    measurementId: "G-GWW8NG61FK"
  };
  window.fbUpdateDoc = updateDoc;
  window.fbDoc = doc;
  window.fbGetDoc = getDoc;
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db;
  window._fbCollection = collection;
  window.fbAddDoc = addDoc;
  window.fbCollection = collection;
  window.fbTimestamp = serverTimestamp;

  window._fbUpdateOrderStatus = async (docId, status) => {
    await updateDoc(doc(db, "orders", docId), { status });
  };

  window._listenDriverLocation = (driverUname, cb) => {
    const q = query(collection(db, "drivers"), where("uname", "==", driverUname));
    return onSnapshot(q, snap => {
      if(!snap.empty){
        const drv = snap.docs[0].data();
        if(drv.lat && drv.lng) {
          cb({
            lat:      drv.lat,
            lng:      drv.lng,
            name:     (drv.fname || '') + ' ' + (drv.lname || ''),
            accuracy: drv.accuracy || null
          });
        }
      }
    }, (err) => { console.warn('listenDriverLocation error:', err.message); });
  };
  try {
    const offerDocRef = doc(db, "offers", "daily_offer");
    onSnapshot(offerDocRef, (docSnap) => {
      const promoBar = document.getElementById('daily-promo-bar');
      const promoText = document.getElementById('daily-promo-text');
      
      if (docSnap.exists()) {
        const offerData = docSnap.data();
        if (offerData.show === true && offerData.text) {
          promoText.textContent = offerData.text;
          promoBar.style.display = 'block';
        } else {
          promoBar.style.display = 'none';
        }
      } else {
        promoBar.style.display = 'none';
      }
    });
  } catch (error) {
    console.error("خطأ أثناء جلب العروض اليومية:", error);
  }
  window._allMenuCategories = [];
  window._allShops = [];

  try {
    const { orderBy: ob } = await import("https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js");
    onSnapshot(query(collection(db,"menu_categories"), ob("order","asc")), snap => {
      window._allMenuCategories = [];
      snap.forEach(d => window._allMenuCategories.push({id:d.id,...d.data()}));
      if(typeof renderMenuPage==='function') renderMenuPage();
    });
    onSnapshot(collection(db,"shops"), snap => {
      window._allShops = [];
      snap.forEach(d => window._allShops.push({id:d.id,...d.data()}));
      if(typeof renderMenuPage==='function') renderMenuPage();
    });
  } catch(e){ console.warn("shops/cats listener:", e); }

  window._firebaseReady = true;
  window._fbOnSnapshot = onSnapshot;
  window._fbDoc = doc;
  window._fbQuery = query;
  window._fbWhere = where;
  console.log("✅ Firebase Client Ready");</script>

<script>
// تحديث الفورم بناءً على نوع الخدمة
function updateFormLayout() {
  const type = document.getElementById("otype").value;
  const isOtherServices = type.includes("خدمات اخرى");
  document.getElementById("simple-fields").style.display = isOtherServices ? "none" : "block";
  document.getElementById("simple-buttons").style.display = isOtherServices ? "none" : "block";
  document.getElementById("multistep-buttons").style.display = isOtherServices ? "block" : "none";
}

function goBackStep(currentStep, previousStep) {
  document.getElementById("step-" + currentStep).style.display = "none";
  document.getElementById("step-" + previousStep).style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function nextStep(currentStep, nextStepNum) {
  if (currentStep === 1) {
    const area = document.getElementById("order-area-select").value.trim();
    const type = document.getElementById("otype").value.trim();
    const place = document.getElementById("oplace").value.trim();
    if (!area || !type || !place) {
      alert("⚠️ أكمل جميع الحقول المطلوبة");
      return;
    }
  } else if (currentStep === 2) {
    const details = document.getElementById("odetails-step2").value.trim();
    if (!details) { alert("⚠️ اكتب تفاصيل الطلب"); return; }
  }
  document.getElementById("step-" + currentStep).style.display = "none";
  document.getElementById("step-" + nextStepNum).style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
</script>
