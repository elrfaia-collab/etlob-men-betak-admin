<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>بورتال السائق — اطلب من بيتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCu31Gb8MLmvxAZCurGKTSQs4DTePSWw_I",
    authDomain: "etlop--mn---betak.firebaseapp.com",
    projectId: "etlop--mn---betak",
    storageBucket: "etlop--mn---betak.firebasestorage.app",
    messagingSenderId: "415855489057",
    appId: "1:415855489057:web:d3526177d5a4353332f360"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db;

  // ── تسجيل دخول السائق ──
  window._driverLogin = async (uname, pass) => {
    const q = query(collection(db, "drivers"), where("uname", "==", uname));
    const snap = await getDocs(q);
    if(snap.empty) return { ok: false, msg: "اسم المستخدم مش موجود" };
    const d = snap.docs[0].data();
    if(d.pass !== pass) return { ok: false, msg: "كلمة السر غلط" };
    if(d.status === "معلق") return { ok: false, msg: "حسابك موقوف، تواصل مع الأدمن" };
    return { ok: true, driver: { ...d, _docId: snap.docs[0].id } };
  };

  // ── الاستماع للطلبات المتاحة (جديد) ──
  window._listenAvailableOrders = (cb) => {
    const q = query(collection(db, "orders"), where("status", "==", "جديد"));
    return onSnapshot(q, snap => {
      const orders = snap.docs.map(d => ({ ...d.data(), _docId: d.id }));
      cb(orders);
    }, err => {
      console.error('Available orders error:', err);
      alert('خطأ في تحميل الطلبات: ' + err.message + '\nافتح Firebase Console وأنشئ الـ Index المطلوب');
    });
  };

  // ── الاستماع لطلبات السائق الحالية ──
  window._listenMyOrders = (driverName, cb) => {
    const q = query(collection(db, "orders"), where("driverName", "==", driverName));
    return onSnapshot(q, snap => {
      const orders = snap.docs.map(d => ({ ...d.data(), _docId: d.id }));
      cb(orders);
    }, err => {
      console.error('My orders error:', err);
    });
  };

  // ── قبول طلب ──
  window._acceptOrder = async (docId, driver) => {
    await updateDoc(doc(db, "orders", docId), {
      status: "في انتظار التحضير",
      driverName: driver.fname + " " + driver.lname,
      driverPhone: driver.phone,
      driverUname: driver.uname,
      driverArea: driver.area,
    });
  };

  // ── تحديث حالة طلب ──
  window._updateOrderStatus = async (docId, status) => {
    await updateDoc(doc(db, "orders", docId), { status });
  };

  // ── تحديث حالة السائق (أونلاين + موقع + دقة GPS) ──
  window._updateDriverStatus = async (docId, isOnline, lat, lng, accuracy) => {
    const data = {
      online: isOnline,
      lastSeen: new Date().toISOString(),
    };
    if(lat && lng) {
      data.lat = lat;
      data.lng = lng;
      if(accuracy) data.accuracy = Math.round(accuracy); // بالمتر
    }
    await updateDoc(doc(db, "drivers", docId), data);
  };

  // ── الاستماع لكل السائقين (للأدمن) ──
  window._listenDrivers = (cb) => {
    return onSnapshot(collection(db, "drivers"), snap => {
      const drivers = snap.docs.map(d => ({ ...d.data(), _docId: d.id }));
      cb(drivers);
    });
  };

  // ── تحديث بيانات الطلب (موقع السائق) ──
  window._fbUpdateOrder = async (docId, data) => {
    await updateDoc(doc(db, "orders", docId), data);
  };

  window._firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));
  console.log("✅ Driver Firebase Ready");
</script>

<style>
:root {
  --bg: #0f1117;
  --bg2: #181c27;
  --bg3: #1e2335;
  --card: #1a1f2e;
  --border: #2a3050;
  --accent: #f59e0b;
  --accent2: #fbbf24;
  --green: #10b981;
  --blue: #3b82f6;
  --red: #ef4444;
  --purple: #8b5cf6;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --faint: #64748b;
  --font: 'Cairo', sans-serif;
  --radius: 14px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }

/* ══════════════ LOGIN ══════════════ */
#login-screen {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 50% 0%, #1e2a4a 0%, #0f1117 60%);
  padding:20px;
}
.login-box {
  background:var(--card); border:1px solid var(--border); border-radius:24px;
  padding:40px 36px; width:100%; max-width:400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(245,158,11,0.1);
}
.login-logo { text-align:center; margin-bottom:28px; }
.login-logo .icon { font-size:48px; display:block; margin-bottom:8px; }
.login-logo h1 { font-size:22px; font-weight:900; color:var(--accent); }
.login-logo p { font-size:13px; color:var(--muted); margin-top:4px; }
.lfield { margin-bottom:16px; }
.lfield label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600; }
.lfield input {
  width:100%; background:var(--bg2); border:1.5px solid var(--border); border-radius:10px;
  padding:12px 16px; color:var(--text); font-family:var(--font); font-size:15px;
  outline:none; transition:border-color .2s;
  direction:ltr; text-align:right;
}
.lfield input:focus { border-color:var(--accent); }
.lfield input::placeholder { color:var(--faint); }
.login-btn {
  width:100%; background:var(--accent); color:#0f1117; border:none; border-radius:12px;
  padding:14px; font-family:var(--font); font-size:16px; font-weight:900;
  cursor:pointer; transition:all .2s; margin-top:8px;
}
.login-btn:hover { background:var(--accent2); transform:translateY(-1px); }
.login-btn:active { transform:translateY(0); }
.login-err {
  background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.3);
  color:#fca5a5; border-radius:8px; padding:10px 14px;
  font-size:13px; margin-top:12px; display:none; text-align:center;
}
.login-err.show { display:block; }

/* ══════════════ APP ══════════════ */
#app { display:none; flex-direction:column; min-height:100vh; }
#app.on { display:flex; }

/* ── Header ── */
.hdr {
  background:var(--bg2); border-bottom:1px solid var(--border);
  padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.hdr-left { display:flex; align-items:center; gap:12px; }
.hdr-avatar {
  width:40px; height:40px; border-radius:50%; background:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:900; color:#0f1117; flex-shrink:0;
}
.hdr-name { font-size:15px; font-weight:700; }
.hdr-area { font-size:12px; color:var(--muted); }
.hdr-right { display:flex; align-items:center; gap:10px; }
.online-toggle {
  display:flex; align-items:center; gap:8px;
  background:var(--bg3); border:1px solid var(--border); border-radius:20px;
  padding:6px 14px; cursor:pointer; transition:all .2s;
}
.online-toggle .dot {
  width:8px; height:8px; border-radius:50%; background:var(--faint); transition:background .3s;
}
.online-toggle.on .dot { background:var(--green); box-shadow:0 0 8px var(--green); }
.online-toggle span { font-size:13px; font-weight:700; }
.logout-btn {
  background:transparent; border:1px solid var(--border); color:var(--muted);
  border-radius:8px; padding:6px 12px; font-family:var(--font); font-size:12px;
  cursor:pointer; transition:all .2s;
}
.logout-btn:hover { border-color:var(--red); color:var(--red); }

/* ── Tabs ── */
.tabs {
  display:flex; background:var(--bg2); border-bottom:1px solid var(--border);
  padding:0 16px; gap:4px; overflow-x:auto;
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  padding:14px 18px; font-family:var(--font); font-size:14px; font-weight:700;
  color:var(--muted); background:transparent; border:none; cursor:pointer;
  border-bottom:3px solid transparent; transition:all .2s; white-space:nowrap; position:relative;
}
.tab:hover { color:var(--text); }
.tab.on { color:var(--accent); border-bottom-color:var(--accent); }
.tab-badge {
  position:absolute; top:8px; right:6px;
  background:var(--red); color:#fff; border-radius:20px;
  font-size:10px; padding:1px 6px; font-weight:900;
}

/* ── Pages ── */
.page { display:none; padding:20px; flex:1; }
.page.on { display:block; }

/* ── Stats bar ── */
.stats-row {
  display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;
}
.stat-card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 12px; text-align:center;
}
.stat-num { font-size:26px; font-weight:900; }
.stat-lbl { font-size:12px; color:var(--muted); margin-top:2px; }
.stat-num.yellow { color:var(--accent); }
.stat-num.green { color:var(--green); }
.stat-num.blue { color:var(--blue); }

/* ── Section title ── */
.sec-title {
  font-size:14px; font-weight:700; color:var(--muted); text-transform:uppercase;
  letter-spacing:.5px; margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.sec-title::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── Order Cards ── */
.order-card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  margin-bottom:14px; overflow:hidden; transition:border-color .2s, transform .2s;
  animation: slideIn .3s ease;
}
@keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.order-card:hover { border-color:rgba(245,158,11,.3); transform:translateY(-1px); }
.order-card.new-order { border-color:rgba(245,158,11,.4); }
.order-card.my-active { border-color:rgba(16,185,129,.3); }

.oc-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; border-bottom:1px solid var(--border);
}
.oc-id { font-size:15px; font-weight:900; color:var(--accent); }
.oc-time { font-size:12px; color:var(--faint); }

.oc-body { padding:14px 16px; }
.oc-row { display:flex; gap:10px; margin-bottom:8px; align-items:flex-start; }
.oc-row:last-child { margin-bottom:0; }
.oc-ico { font-size:16px; flex-shrink:0; margin-top:1px; }
.oc-info { flex:1; }
.oc-lbl { font-size:11px; color:var(--faint); }
.oc-val { font-size:14px; font-weight:600; }

.badge {
  display:inline-block; padding:3px 10px; border-radius:20px;
  font-size:11px; font-weight:700;
}
.b-new { background:rgba(245,158,11,.15); color:var(--accent); }
.b-prep { background:rgba(139,92,246,.15); color:#a78bfa; }
.b-go { background:rgba(59,130,246,.15); color:#60a5fa; }
.b-done { background:rgba(16,185,129,.15); color:var(--green); }
.b-cancel { background:rgba(239,68,68,.15); color:#fca5a5; }

.oc-actions {
  display:flex; gap:8px; padding:12px 16px;
  border-top:1px solid var(--border); flex-wrap:wrap;
}
.abtn {
  flex:1; min-width:90px; border:none; border-radius:10px; padding:10px 14px;
  font-family:var(--font); font-size:13px; font-weight:700; cursor:pointer;
  transition:all .2s; display:flex; align-items:center; justify-content:center; gap:6px;
}
.abtn:hover { transform:translateY(-1px); filter:brightness(1.1); }
.abtn:active { transform:translateY(0); }
.abtn.accept { background:var(--green); color:#fff; }
.abtn.prep   { background:var(--purple); color:#fff; }
.abtn.deliver { background:var(--blue); color:#fff; }
.abtn.done   { background:var(--green); color:#fff; }
.abtn.call   { background:var(--bg3); color:var(--text); border:1px solid var(--border); }
.abtn.wa     { background:#25d366; color:#fff; }
.abtn.cancel { background:rgba(239,68,68,.15); color:#fca5a5; border:1px solid rgba(239,68,68,.2); }

/* ── Empty state ── */
.empty {
  text-align:center; padding:60px 20px; color:var(--faint);
}
.empty .big { font-size:48px; margin-bottom:12px; }
.empty p { font-size:15px; }

/* ── Toast ── */
#toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--bg3); border:1px solid var(--border); color:var(--text);
  padding:12px 22px; border-radius:30px; font-size:14px; font-weight:700;
  transition:transform .3s; z-index:999; white-space:nowrap;
  box-shadow:var(--shadow);
}
#toast.show { transform:translateX(-50%) translateY(0); }

/* ── Profile page ── */
.profile-card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:24px; margin-bottom:16px;
}
.profile-avatar {
  width:72px; height:72px; border-radius:50%; background:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-size:32px; font-weight:900; color:#0f1117; margin:0 auto 16px;
}
.profile-name { text-align:center; font-size:20px; font-weight:900; margin-bottom:4px; }
.profile-uname { text-align:center; font-size:13px; color:var(--muted); margin-bottom:16px; }
.profile-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--border);
}
.profile-row:last-child { border-bottom:none; }
.pr-lbl { font-size:13px; color:var(--muted); }
.pr-val { font-size:14px; font-weight:700; }

/* ── Loading overlay ── */
#loading {
  position:fixed; inset:0; background:rgba(15,17,23,.9);
  display:flex; align-items:center; justify-content:center;
  z-index:999; transition:opacity .3s;
}
#loading.hide { opacity:0; pointer-events:none; }
.spinner {
  width:44px; height:44px; border:3px solid var(--border);
  border-top-color:var(--accent); border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Responsive ── */
@media(max-width:480px) {
  .hdr { padding:12px 14px; }
  .page { padding:14px; }
  .stats-row { gap:8px; }
  .stat-card { padding:12px 8px; }
  .stat-num { font-size:22px; }
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading"><div class="spinner"></div></div>

<!-- ══════════ LOGIN ══════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <span class="icon">🛵</span>
      <h1>بورتال السائق</h1>
      <p>اطلب من بيتك — نظام التوصيل</p>
    </div>
    <div class="lfield">
      <label>اسم المستخدم</label>
      <input type="text" id="l-uname" placeholder="driver_mahmoud" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('l-pass').focus()"/>
    </div>
    <div class="lfield">
      <label>كلمة السر</label>
      <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="login-btn" onclick="doLogin()">دخول 🚀</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-avatar" id="hdr-avatar">?</div>
      <div>
        <div class="hdr-name" id="hdr-name">—</div>
        <div class="hdr-area" id="hdr-area">—</div>
      </div>
    </div>
    <div class="hdr-right">
      <div id="gps-accuracy-badge" style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(100,116,139,.15);color:#94a3b8;display:flex;align-items:center;white-space:nowrap;transition:background .4s,color .4s;">📡 GPS...</div>
      <div class="online-toggle on" id="online-toggle" onclick="toggleOnline()">
        <div class="dot"></div>
        <span id="online-txt">متاح</span>
      </div>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab on" onclick="nav('available')" id="tab-available">
      📋 طلبات جديدة
      <span class="tab-badge" id="badge-available" style="display:none">0</span>
    </button>
    <button class="tab" onclick="nav('myorders')" id="tab-myorders">
      🛵 طلباتي
      <span class="tab-badge" id="badge-myorders" style="display:none">0</span>
    </button>
    <button class="tab" onclick="nav('profile')" id="tab-profile">👤 حسابي</button>
  </div>

  <!-- ── Page: Available Orders ── -->
  <div class="page on" id="page-available">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num yellow" id="st-available">0</div><div class="stat-lbl">متاحة</div></div>
      <div class="stat-card"><div class="stat-num blue" id="st-active">0</div><div class="stat-lbl">جارية</div></div>
      <div class="stat-card"><div class="stat-num green" id="st-done">0</div><div class="stat-lbl">مكتملة</div></div>
    </div>
    <div class="sec-title">الطلبات الجديدة المتاحة</div>
    <div id="available-list"></div>
  </div>

  <!-- ── Page: My Orders ── -->
  <div class="page" id="page-myorders">
    <div class="sec-title">طلباتي الحالية والمنتهية</div>
    <div id="myorders-list"></div>
  </div>

  <!-- ── Page: Profile ── -->
  <div class="page" id="page-profile">
    <div class="profile-card">
      <div class="profile-avatar" id="p-avatar">?</div>
      <div class="profile-name" id="p-name">—</div>
      <div class="profile-uname" id="p-uname">—</div>
      <div class="profile-row"><span class="pr-lbl">📱 الهاتف</span><span class="pr-val" id="p-phone">—</span></div>
      <div class="profile-row"><span class="pr-lbl">📍 المنطقة</span><span class="pr-val" id="p-area">—</span></div>
      <div class="profile-row"><span class="pr-lbl">🚗 النوع</span><span class="pr-val" id="p-vtype">—</span></div>
      <div class="profile-row"><span class="pr-lbl">🔢 اللوحة</span><span class="pr-val" id="p-plate">—</span></div>
      <div class="profile-row"><span class="pr-lbl">⭐ التقييم</span><span class="pr-val" id="p-rating">—</span></div>
      <div class="profile-row"><span class="pr-lbl">📦 إجمالي الطلبات</span><span class="pr-val" id="p-orders">—</span></div>
    </div>
  </div>

</div><!-- /app -->

<!-- Toast -->
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let currentDriver = null;
let isOnline = true;
let unsubAvailable = null;
let unsubMy = null;
let availableOrders = [];
let myOrders = [];

// ══════════════════════════════════════════════
//  INIT — wait for Firebase
// ══════════════════════════════════════════════
function waitFirebase(cb) {
  if(window._firebaseReady) { cb(); return; }
  const t = setInterval(() => {
    if(window._firebaseReady) { clearInterval(t); cb(); }
  }, 80);
}

waitFirebase(() => {
  document.getElementById('loading').classList.add('hide');
  // restore session
  const saved = sessionStorage.getItem('drv_session');
  if(saved) {
    try {
      currentDriver = JSON.parse(saved);
      startApp();
    } catch(e) { sessionStorage.removeItem('drv_session'); }
  }
});

// ══════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════
async function doLogin() {
  const uname = document.getElementById('l-uname').value.trim();
  const pass  = document.getElementById('l-pass').value.trim();
  const errEl = document.getElementById('login-err');
  errEl.classList.remove('show');

  if(!uname || !pass) { showErr('أدخل اسم المستخدم وكلمة السر'); return; }
  if(!window._driverLogin) { 
    showErr('جاري الاتصال بالخادم...');
    window.addEventListener('firebaseReady', ()=>doLogin(), {once:true});
    return; 
  }

  // Show loading
  const btn = document.querySelector('.login-btn');
  btn.textContent = '⏳ جاري الدخول...';
  btn.disabled = true;

  const result = await window._driverLogin(uname, pass);
  btn.textContent = 'دخول 🚀';
  btn.disabled = false;

  if(!result.ok) { showErr(result.msg); return; }

  currentDriver = result.driver;
  sessionStorage.setItem('drv_session', JSON.stringify(currentDriver));
  startApp();
}

function showErr(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg;
  el.classList.add('show');
}

// ══════════════════════════════════════════════
//  START APP
// ══════════════════════════════════════════════
function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('on');

  const initials = (currentDriver.fname||'?')[0];
  document.getElementById('hdr-avatar').textContent = initials;
  document.getElementById('hdr-name').textContent = currentDriver.fname + ' ' + currentDriver.lname;
  document.getElementById('hdr-area').textContent = currentDriver.area || '';

  // Profile page
  document.getElementById('p-avatar').textContent = initials;
  document.getElementById('p-name').textContent = currentDriver.fname + ' ' + currentDriver.lname;
  document.getElementById('p-uname').textContent = '@' + currentDriver.uname;
  document.getElementById('p-phone').textContent = currentDriver.phone || '—';
  document.getElementById('p-area').textContent = currentDriver.area || '—';
  document.getElementById('p-vtype').textContent = currentDriver.vtype || '—';
  document.getElementById('p-plate').textContent = currentDriver.plate || '—';
  document.getElementById('p-rating').textContent = (currentDriver.rating || 5.0) + ' ⭐';
  document.getElementById('p-orders').textContent = (currentDriver.orders || 0) + ' طلب';

  // Subscribe listeners
  listenOrders();
}

// ══════════════════════════════════════════════
//  LISTENERS
// ══════════════════════════════════════════════
function listenOrders() {
  if(unsubAvailable) unsubAvailable();
  if(unsubMy) unsubMy();

  // Available orders (جديد فقط - للسائقين يشوفوا ويقبلوا)
  unsubAvailable = window._listenAvailableOrders(orders => {
    // Sort by createdAt descending in JS
    availableOrders = orders.sort((a,b) => {
      const ta = a.createdAt?.seconds || 0;
      const tb = b.createdAt?.seconds || 0;
      return tb - ta;
    });
    renderAvailable();
    updateStats();
  });

  // My orders
  const fullName = currentDriver.fname + ' ' + currentDriver.lname;
  unsubMy = window._listenMyOrders(fullName, orders => {
    // Sort by createdAt descending in JS
    myOrders = orders.sort((a,b) => {
      const ta = a.createdAt?.seconds || 0;
      const tb = b.createdAt?.seconds || 0;
      return tb - ta;
    });
    renderMyOrders();
    updateBadges();
    updateStats();
  });
}

// ══════════════════════════════════════════════
//  RENDER AVAILABLE
// ══════════════════════════════════════════════
function renderAvailable() {
  const el = document.getElementById('available-list');
  if(!availableOrders.length) {
    el.innerHTML = `<div class="empty"><div class="big">📭</div><p>مفيش طلبات جديدة دلوقتي</p></div>`;
    return;
  }
  el.innerHTML = availableOrders.map(o => `
    <div class="order-card new-order" id="oc-${o._docId}">
      <div class="oc-head">
        <span class="oc-id">${o.id}</span>
        <span class="oc-time">${o.time||''}</span>
      </div>
      <div class="oc-body">
        <div class="oc-row">
          <span class="oc-ico">🏪</span>
          <div class="oc-info"><div class="oc-lbl">نوع الطلب</div><div class="oc-val">${o.type||'—'}</div></div>
        </div>
        <div class="oc-row">
          <span class="oc-ico">📍</span>
          <div class="oc-info"><div class="oc-lbl">من</div><div class="oc-val">${getOrderPickup(o)}</div></div>
        </div>
        <div class="oc-row">
          <span class="oc-ico">🏠</span>
          <div class="oc-info"><div class="oc-lbl">العنوان</div><div class="oc-val">${getOrderAddr(o)}</div></div>
        </div>
        ${o.senderPhone?`<div class="oc-row"><span class="oc-ico">📤</span><div class="oc-info"><div class="oc-lbl">المُرسل ${o.senderName&&o.senderName!=='غير محدد'?'('+o.senderName+')':''}</div><div class="oc-val" dir="ltr">${o.senderPhone}</div></div></div>`:''}
        ${o.receiverPhone?`<div class="oc-row"><span class="oc-ico">📥</span><div class="oc-info"><div class="oc-lbl">المُستقبل ${o.receiverName&&o.receiverName!=='غير محدد'?'('+o.receiverName+')':''}</div><div class="oc-val" dir="ltr">${o.receiverPhone}</div></div></div>`:''}
        ${o.details ? `<div class="oc-row"><span class="oc-ico">📝</span><div class="oc-info"><div class="oc-lbl">تفاصيل</div><div class="oc-val">${o.details}</div></div></div>` : ''}
      </div>
      <div class="oc-actions">
        <button class="abtn accept" onclick="acceptOrder('${o._docId}','${o.id}')">✅ قبول</button>
        <button class="abtn wa" onclick="contactWA('${getOrderSenderPhone(o)}')">💬 واتساب</button>
        <button class="abtn call" onclick="callClient('${getOrderSenderPhone(o)}')">📞 اتصال</button>
      </div>
    </div>
  `).join('');
}


// 📍 دوال موحدة لقراءة بيانات الطلب (تدعم الفورم القديم والجديد)
function getOrderAddr(o){
  if(o.addr) return o.addr;
  if(o.address) return o.address;
  if(o.deliveryAddress) return o.deliveryAddress;
  return '—';
}
function getOrderPickup(o){
  if(o.pickupAddress) return o.pickupAddress;
  return o.place || '—';
}
function getOrderPhone(o){
  if(o.phone) return o.phone;
  return o.receiverPhone || o.senderPhone || '';
}
function getOrderSenderPhone(o){
  return o.senderPhone || o.phone || '';
}

// ══════════════════════════════════════════════
//  RENDER MY ORDERS
// ══════════════════════════════════════════════
const STATUS_BADGE = {
  'جديد':'b-new','في انتظار التحضير':'b-prep','جاري التحضير':'b-prep',
  'جاري التوصيل':'b-go','تم التوصيل':'b-done','ملغي':'b-cancel'
};

function renderMyOrders() {
  const el = document.getElementById('myorders-list');
  if(!myOrders.length) {
    el.innerHTML = `<div class="empty"><div class="big">🛵</div><p>مفيش طلبات مسندة إليك</p></div>`;
    return;
  }
  el.innerHTML = myOrders.map(o => `
    <div class="order-card my-active">
      <div class="oc-head">
        <span class="oc-id">${o.id}</span>
        <span class="badge ${STATUS_BADGE[o.status]||'b-new'}">${o.status}</span>
      </div>
      <div class="oc-body">
        <div class="oc-row">
          <span class="oc-ico">🏪</span>
          <div class="oc-info"><div class="oc-lbl">من</div><div class="oc-val">${getOrderPickup(o)}</div></div>
        </div>
        <div class="oc-row">
          <span class="oc-ico">🏠</span>
          <div class="oc-info"><div class="oc-lbl">إلى</div><div class="oc-val">${getOrderAddr(o)}</div></div>
        </div>
        <div class="oc-row">
          <span class="oc-ico">📱</span>
          <div class="oc-info"><div class="oc-lbl">العميل</div><div class="oc-val" dir="ltr">${getOrderPhone(o)||'—'}</div></div>
        </div>
        ${o.senderPhone?`<div class="oc-row"><span class="oc-ico">📤</span><div class="oc-info"><div class="oc-lbl">المُرسل ${o.senderName&&o.senderName!=='غير محدد'?'('+o.senderName+')':''}</div><div class="oc-val" dir="ltr">${o.senderPhone}</div></div></div>`:''}
        ${o.receiverPhone?`<div class="oc-row"><span class="oc-ico">📥</span><div class="oc-info"><div class="oc-lbl">المُستقبل ${o.receiverName&&o.receiverName!=='غير محدد'?'('+o.receiverName+')':''}</div><div class="oc-val" dir="ltr">${o.receiverPhone}</div></div></div>`:''}
        ${o.pickupAddress?`<div class="oc-row"><span class="oc-ico">📤</span><div class="oc-info"><div class="oc-lbl">عنوان الاستلام</div><div class="oc-val">${o.pickupAddress}</div></div></div>`:''}
        <div class="oc-row" style="display:none">
        </div>
        ${o.details ? `<div class="oc-row"><span class="oc-ico">📝</span><div class="oc-info"><div class="oc-lbl">تفاصيل</div><div class="oc-val">${o.details}</div></div></div>` : ''}
        ${o.notes ? `<div class="oc-row"><span class="oc-ico">💬</span><div class="oc-info"><div class="oc-lbl">ملاحظات</div><div class="oc-val">${o.notes}</div></div></div>` : ''}
      </div>
      <div class="oc-actions">
        ${o.status==='في انتظار التحضير' ? `<button class="abtn prep" onclick="updateStatus('${o._docId}','${o.id}','جاري التحضير')">🍳 جاري التحضير</button>` : ''}
        ${o.status==='جاري التحضير' ? `<button class="abtn deliver" onclick="updateStatus('${o._docId}','${o.id}','جاري التوصيل')">🛵 جاري التوصيل</button>` : ''}
        ${o.status==='جاري التوصيل' ? `<button class="abtn done" onclick="updateStatus('${o._docId}','${o.id}','تم التوصيل')">✅ تم التوصيل</button>` : ''}
        <button class="abtn wa" onclick="contactWA('${getOrderPhone(o)}')">💬 واتساب</button>
        <button class="abtn call" onclick="callClient('${getOrderPhone(o)}')">📞 اتصال</button>
      </div>
    </div>
  `).join('');
}

// ══════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════
async function acceptOrder(docId, orderId) {
  if(!isOnline) { showToast('⚠️ أنت غير متاح دلوقتي'); return; }
  if(!window._acceptOrder) { showToast('⚠️ Firebase مش جاهز'); return; }
  try {
    await window._acceptOrder(docId, currentDriver);
    showToast('✅ تم قبول ' + orderId);
    nav('myorders');
  } catch(e) {
    showToast('❌ خطأ: ' + e.message);
  }
}

async function updateStatus(docId, orderId, status) {
  if(!window._updateOrderStatus) { showToast('⚠️ Firebase مش جاهز'); return; }
  try {
    await window._updateOrderStatus(docId, status);
    showToast('✅ ' + orderId + ' → ' + status);
  } catch(e) {
    showToast('❌ خطأ: ' + e.message);
  }
}

function contactWA(phone) {
  if(!phone) { showToast('⚠️ مفيش رقم'); return; }
  const num = phone.replace(/[^0-9]/g,'');
  const intl = num.startsWith('0') ? '2' + num : num;
  window.open('https://wa.me/' + intl, '_blank');
}

function callClient(phone) {
  if(!phone) { showToast('⚠️ مفيش رقم'); return; }
  window.location.href = 'tel:' + phone;
}

// ══════════════════════════════════════════════
//  ONLINE TOGGLE
// ══════════════════════════════════════════════
let _gpsWatchId = null;   // watchPosition ID (يشتغل على Android و iOS)
let _gpsInterval = null;  // fallback interval للأجهزة القديمة
let _currentLat = null;
let _currentLng = null;
let _currentAcc = null;  // دقة GPS بالمتر
let _lastSentTime = 0;    // منع إرسال متكرر جداً

function toggleOnline() {
  isOnline = !isOnline;
  const tog = document.getElementById('online-toggle');
  const txt = document.getElementById('online-txt');
  if(isOnline) {
    tog.classList.add('on');
    txt.textContent = 'متاح';
    showToast('🟢 أنت متاح الآن');
    startGPS();
  } else {
    tog.classList.remove('on');
    txt.textContent = 'غير متاح';
    showToast('🔴 أنت غير متاح');
    stopGPS();
  }
  // Update Firebase
  if(currentDriver?._docId && window._updateDriverStatus) {
    window._updateDriverStatus(currentDriver._docId, isOnline, _currentLat, _currentLng);
  }
}

// ── حد أقصى للدقة المقبولة بالمتر — لو أكتر الموقع مش موثوق ──
const GPS_ACCURACY_THRESHOLD = 80;

function _onGPSSuccess(pos) {
  const acc = pos.coords.accuracy;
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  _updateAccuracyBadge(acc);
  if(acc > GPS_ACCURACY_THRESHOLD) {
    console.warn('GPS accuracy too low: ' + Math.round(acc) + 'm — waiting for better fix');
    return;
  }
  _currentLat = lat;
  _currentLng = lng;
  _currentAcc = acc;
  const now = Date.now();
  if(now - _lastSentTime >= 15000) {
    _lastSentTime = now;
    sendLocationToFirebase();
  }
}

function _onGPSError(err) {
  console.warn('GPS error:', err.code, err.message);
  _updateAccuracyBadge(null, err.code);
  if(!_gpsInterval) {
    _gpsInterval = setInterval(() => {
      navigator.geolocation.getCurrentPosition(
        _onGPSSuccess,
        (e) => console.warn('GPS fallback error:', e.message),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
      );
    }, 30000);
  }
}

function _updateAccuracyBadge(acc, errCode) {
  const badge = document.getElementById('gps-accuracy-badge');
  if(!badge) return;
  if(errCode !== undefined) {
    const msgs = { 1:'مرفوض — افتح إذن الموقع', 2:'إشارة GPS ضعيفة', 3:'انتهت مهلة GPS' };
    badge.textContent = '📡 ' + (msgs[errCode] || 'خطأ GPS');
    badge.style.background = 'rgba(239,68,68,.2)'; badge.style.color = '#fca5a5';
    return;
  }
  if(acc === null) return;
  const m = Math.round(acc);
  if(m <= 15)      { badge.textContent = '📡 دقة ممتازة ±' + m + 'م';    badge.style.background='rgba(16,185,129,.2)'; badge.style.color='#6ee7b7'; }
  else if(m <= 40) { badge.textContent = '📡 دقة جيدة ±' + m + 'م';      badge.style.background='rgba(59,130,246,.2)'; badge.style.color='#93c5fd'; }
  else if(m <= 80) { badge.textContent = '📡 دقة مقبولة ±' + m + 'م';    badge.style.background='rgba(245,158,11,.2)'; badge.style.color='#fcd34d'; }
  else             { badge.textContent = '📡 دقة ضعيفة ±' + m + 'م ⏳';  badge.style.background='rgba(239,68,68,.15)'; badge.style.color='#fca5a5'; }
}

function startGPS() {
  if(!navigator.geolocation) {
    showToast('⚠️ GPS مش متاح على جهازك');
    return;
  }
  const gpsOpts = { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 };
  _gpsWatchId = navigator.geolocation.watchPosition(_onGPSSuccess, _onGPSError, gpsOpts);
  // أول موقع فوري
  navigator.geolocation.getCurrentPosition(_onGPSSuccess,
    (err) => console.warn('GPS initial error:', err.message), gpsOpts);
}

function stopGPS() {
  if(_gpsWatchId !== null) {
    navigator.geolocation.clearWatch(_gpsWatchId);
    _gpsWatchId = null;
  }
  if(_gpsInterval) { clearInterval(_gpsInterval); _gpsInterval = null; }
  // Mark offline in Firebase
  if(currentDriver?._docId && window._updateDriverStatus) {
    window._updateDriverStatus(currentDriver._docId, false, null, null);
  }
}

function sendLocationToFirebase() {
  if(isOnline && currentDriver?._docId && window._updateDriverStatus) {
    window._updateDriverStatus(currentDriver._docId, true, _currentLat, _currentLng, _currentAcc);
  }
  // Also update active orders with driver location so client can see distance
  if(_currentLat && _currentLng && window._fbUpdateOrder) {
    const activeOrders = (myOrders||[]).filter(o => o.status === 'جاري التوصيل');
    activeOrders.forEach(o => {
      if(o._docId) window._fbUpdateOrder(o._docId, { driverLat: _currentLat, driverLng: _currentLng });
    });
  }
}

// ══════════════════════════════════════════════
//  STATS & BADGES
// ══════════════════════════════════════════════
function updateStats() {
  document.getElementById('st-available').textContent = availableOrders.length;
  const active = myOrders.filter(o => !['تم التوصيل','ملغي'].includes(o.status)).length;
  const done   = myOrders.filter(o => o.status === 'تم التوصيل').length;
  document.getElementById('st-active').textContent = active;
  document.getElementById('st-done').textContent = done;
}

function updateBadges() {
  const active = myOrders.filter(o => !['تم التوصيل','ملغي'].includes(o.status)).length;
  const ba = document.getElementById('badge-available');
  const bm = document.getElementById('badge-myorders');
  if(availableOrders.length > 0) { ba.textContent = availableOrders.length; ba.style.display = ''; }
  else ba.style.display = 'none';
  if(active > 0) { bm.textContent = active; bm.style.display = ''; }
  else bm.style.display = 'none';
}

// ══════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════
function nav(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.getElementById('page-' + page).classList.add('on');
  document.getElementById('tab-' + page).classList.add('on');
}

// ══════════════════════════════════════════════
//  LOGOUT
// ══════════════════════════════════════════════
function doLogout() {
  stopGPS();
  if(unsubAvailable) unsubAvailable();
  if(unsubMy) unsubMy();
  sessionStorage.removeItem('drv_session');
  currentDriver = null;
  document.getElementById('app').classList.remove('on');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('l-uname').value = '';
  document.getElementById('l-pass').value = '';
}

// ══════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
